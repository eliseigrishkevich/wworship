nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--bg2);border-top:3px solid var(--line);padding:8px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:2px;font:800 11px var(--fb);cursor:pointer}
nav button i{display:block;width:50px;margin:0 auto 2px;font-style:normal;font-size:23px;padding:3px 0;border-radius:15px;transition:.2s;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
nav button.on{color:var(--tx)}nav button.on i{background:var(--lime);box-shadow:0 5px 0 #8a6a3a;transform:translateY(-8px) scale(1.1)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:0 0 14px;box-shadow:0 6px 0 rgba(10,25,21,.2)}
.row{display:flex;gap:8px;align-items:center}.sp{flex:1}.mut{color:var(--mut);font-size:13px}
.b{background:var(--ac);color:var(--ink);border:0;border-radius:14px;padding:10px 15px;font:800 15px var(--fb);cursor:pointer;box-shadow:0 5px 0 #44386f,0 9px 12px rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s;text-decoration:none;display:inline-block}
.b:active{transform:translateY(4px);box-shadow:0 1px 0 #44386f}
.b.g{background:var(--cream);box-shadow:0 5px 0 #1f352f,0 9px 12px rgba(0,0,0,.15)}.b.g:active{box-shadow:0 1px 0 #1f352f}.b.s{padding:6px 10px;font-size:13px;border-radius:11px;box-shadow:0 4px 0 #44386f}.b.g.s{box-shadow:0 4px 0 #1f352f}
input,textarea,select{width:100%;background:var(--inp);color:var(--tx);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;margin:0 0 10px}
textarea{min-height:120px;resize:vertical}
h2,.t3d{font:900 26px/1.1 var(--fb);color:var(--h);margin:6px 0 14px;text-shadow:1px 1px 0 #c4b8f2,2px 2px 0 #c4b8f2,3px 3px 0 #8f7fc9,4px 4px 0 #8f7fc9,5px 6px 8px rgba(0,0,0,.25)}
.li{cursor:pointer;transition:transform .15s}.li:active{transform:translateY(3px)}.li b{display:block;font-weight:900}
.tag{display:inline-block;background:var(--lime);color:var(--ink);border-radius:9px;padding:1px 9px;font-size:12px;font-weight:800;margin-right:4px;box-shadow:0 2px 0 #8a6a3a}
.seg{display:flex;background:var(--card2);border-radius:16px;padding:4px;margin-bottom:14px;border:2px solid var(--line)}
.seg button{flex:1;border:0;background:none;color:var(--mut);padding:9px 4px;border-radius:12px;cursor:pointer;font:800 13px var(--fb)}.seg button.on{background:var(--ac);color:var(--ink);box-shadow:0 4px 0 #44386f}
pre.song{white-space:pre-wrap;font-family:var(--fsong);font-size:var(--sfs);line-height:var(--slh);margin:0}.ch{color:var(--chord);font-weight:800}
.mh{position:relative;height:240px;border-radius:26px;overflow:hidden;margin-bottom:14px;border:3px solid var(--cream);box-shadow:0 7px 0 rgba(10,25,21,.3);background:#1d322d}
.strip{position:absolute;inset:0;display:flex;align-items:center;width:max-content;animation:mq 45s linear infinite}
.strip img{height:175px;width:132px;object-fit:cover;border:5px solid var(--cream);border-radius:8px;margin:0 -8px;transform:rotate(var(--r));box-shadow:0 10px 18px rgba(0,0,0,.45)}
@keyframes mq{to{transform:translateX(-50%)}}
.mh::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,40,35,.05) 30%,rgba(20,40,35,.75))}
.mh h1{position:absolute;z-index:2;left:0;right:0;bottom:14px;margin:0;text-align:center;font:900 clamp(34px,11vw,58px)/1 var(--fb);color:#f1ead9;text-shadow:1px 1px 0 #c4b8f2,2px 2px 0 #c4b8f2,3px 3px 0 #8f7fc9,4px 4px 0 #8f7fc9,5px 5px 0 #5d4f8a,6px 8px 10px rgba(0,0,0,.45)}
.cap{background:var(--lime);color:var(--ink);border-radius:16px;padding:10px 14px;font-weight:800;font-size:14px;margin:0 0 16px;box-shadow:0 5px 0 #8a6a3a}
.chat{display:flex;flex-direction:column;gap:12px;padding-bottom:230px}
.msg{max-width:88%;background:var(--card);border:2px solid var(--line);border-radius:18px 18px 18px 4px;padding:10px 12px;box-shadow:0 5px 0 rgba(10,25,21,.18)}
.msg.me{align-self:flex-end;background:var(--me);color:var(--metx);border-radius:18px 18px 4px 18px;border-color:#f1ead9}.msg.me .mut{color:#7a3a1d}
.msg img{width:100%;border-radius:12px;margin:6px 0;display:block;border:3px solid #f1ead9}.msg h4{margin:0 0 2px;font:900 16px var(--fb)}.msg p{margin:4px 0 0;white-space:pre-wrap}
.comp{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--bg2);border-top:3px solid var(--line);padding:8px 12px;z-index:5}
.comp>div{max-width:720px;margin:0 auto}.comp input,.comp textarea{margin-bottom:6px}.comp textarea{min-height:44px;height:44px}
.modal{position:fixed;inset:0;background:rgba(5,15,12,.65);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));border-top:4px solid var(--lime)}
.vote{border:2px solid var(--line);background:var(--card2);color:var(--tx);border-radius:13px;padding:6px 11px;cursor:pointer;font:800 14px var(--fb);box-shadow:0 4px 0 rgba(10,25,21,.2)}.vote.on{background:var(--lime);color:var(--ink);box-shadow:0 4px 0 #8a6a3a}
.empty{text-align:center;color:var(--mut);padding:24px 10px;font-weight:800}
.cubewrap{perspective:500px;height:90px;display:grid;place-items:center}
.cube{width:60px;height:60px;position:relative;transform-style:preserve-3d;animation:spin 8s linear infinite}
.cube span{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#f1ead9,#ffc9a6);border:3px solid #fff;border-radius:9px;box-shadow:inset 0 0 12px rgba(255,120,70,.5)}
.cube span:nth-child(1){transform:translateZ(30px)}.cube span:nth-child(2){transform:rotateY(90deg) translateZ(30px)}.cube span:nth-child(3){transform:rotateY(180deg) translateZ(30px)}.cube span:nth-child(4){transform:rotateY(-90deg) translateZ(30px)}.cube span:nth-child(5){transform:rotateX(90deg) translateZ(30px)}.cube span:nth-child(6){transform:rotateX(-90deg) translateZ(30px)}
@keyframes spin{from{transform:rotateX(-22deg) rotateY(0)}to{transform:rotateX(-22deg) rotateY(360deg)}}
.ballwrap{position:relative;height:150px;display:grid;place-items:center}
.ballwrap::after{content:"";position:absolute;bottom:12px;width:84px;height:12px;border-radius:50%;background:rgba(0,0,0,.3);filter:blur(3px);animation:shd 1.7s ease-in-out infinite}
.ball{position:relative;width:104px;height:104px;animation:bnc 1.7s ease-in-out infinite;z-index:1}
.bl{position:absolute;inset:0;border-radius:50%;overflow:hidden;box-shadow:0 6px 0 rgba(10,25,21,.25);border:2px solid #1d322d}
.bl svg{width:100%;height:100%;animation:rot 9s linear infinite}
.bl i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.8),rgba(255,255,255,0) 36%),radial-gradient(circle at 72% 78%,rgba(5,15,12,.5),rgba(5,15,12,0) 62%)}
.bw{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-8deg);background:#f1ead9;color:#1d322d;font:900 13px var(--fb);padding:4px 10px;border-radius:10px;white-space:nowrap;box-shadow:0 4px 0 #8a6a3a;border:2px solid #1d322d}
.bw.pop{animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes bnc{50%{transform:translateY(-18px)}}@keyframes shd{50%{transform:scale(.7);opacity:.6}}@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pop{from{transform:translate(-50%,-50%) rotate(-8deg) scale(0)}60%{transform:translate(-50%,-50%) rotate(-8deg) scale(1.25)}}
#bell{position:relative}.bd{position:absolute;top:-8px;right:-7px;background:var(--lime);color:#33260f;border-radius:10px;font:900 11px var(--fb);padding:1px 6px;box-shadow:0 2px 0 #8a6a3a}
.toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:520px;margin:0 auto;z-index:60;background:var(--lime);color:#33260f;font-weight:800;border-radius:16px;padding:12px 14px;box-shadow:0 5px 0 #8a6a3a,0 12px 20px rgba(0,0,0,.3);animation:tin .4s cubic-bezier(.2,1.4,.4,1)}@keyframes tin{from{transform:translateY(-90px)}}
.yt{display:block;position:relative;margin:10px 0;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#42655c,#1d322d);aspect-ratio:16/9;border:3px solid #f1ead9;box-shadow:0 5px 0 rgba(10,25,21,.3)}.yt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.yt .pl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:#ff3b30;color:#fff;display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 #a01810}.yt em{position:absolute;left:8px;bottom:6px;font:800 12px var(--fb);color:#fff;background:rgba(0,0,0,.55);border-radius:8px;padding:1px 8px;font-style:normal}
.cal{background:var(--card2);border:2px solid var(--line);border-radius:20px;padding:12px;margin-bottom:14px;box-shadow:0 5px 0 rgba(10,25,21,.2)}.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}.cg.wd span{text-align:center;font:800 12px var(--fb);color:var(--mut)}
.d{aspect-ratio:1;position:relative;border:2px solid var(--line);background:var(--card);color:var(--tx);border-radius:12px;font:900 14px var(--fb);cursor:pointer;box-shadow:0 3px 0 rgba(10,25,21,.2);padding:0}.d.td{border-color:var(--ac)}.d.sel{background:var(--ac);color:var(--ink);box-shadow:0 3px 0 #44386f;transform:translateY(-2px)}
.d u{position:absolute;bottom:3px;left:50%;margin-left:-4px;width:8px;height:8px;border-radius:50%;background:var(--lime);box-shadow:0 1px 0 #8a6a3a}
.gate nav,.gate #who,.gate #bell{display:none}
.stg{background:#101d19;color:#fff;border:3px solid var(--cream);border-radius:18px;padding:16px 14px;box-shadow:0 6px 0 rgba(10,25,21,.35);overflow-x:auto}.stg pre.song{color:#fff;letter-spacing:.02em;font-weight:600}.stg .ch{color:#b9a8f0;font-weight:900}.lbl{color:#8f7fc9;font-weight:800}

/* ---- шрифты и размеры (настраиваются в «Оформлении») ---- */
:root{--fh:Cormorant Garamond,Georgia,serif;--fb:Manrope,system-ui,sans-serif;--hs:1;--fsong:ui-monospace,Menlo,Consolas,monospace;--sfs:18px;--slh:1.8;--zs:1}
main,.comp>div,.modal>div:not(.nz){zoom:var(--zs)}
input[type=range]{padding:0;background:none;border:0;box-shadow:none;accent-color:var(--b1);height:30px}
.tc[data-fp]{font-weight:500}

/* ---- тиснение (цвета берутся из темы) ---- */
body{text-shadow:0 1px 0 var(--sd2)}
input,textarea,select,.stg *{text-shadow:none}
h2,.t3d{color:var(--h);text-shadow:-1px -1px 0 var(--hl1),1px 2px 1px var(--sd1),0 5px 8px var(--sd2)}
.logo3d{color:var(--h);text-shadow:-1px -1px 0 var(--hl1),2px 3px 1px var(--sd1),0 6px 10px var(--sd2)}
.mh h1{color:var(--h);text-shadow:-2px -2px 0 var(--hl1),2px 3px 2px var(--sd1),0 9px 16px var(--sd2)}
.mh{border:2px solid var(--hl2);box-shadow:inset 0 0 0 1px var(--sd2),0 6px 0 var(--sd2)}
header,nav,.comp{background:var(--bg2);border-color:var(--sd2);box-shadow:0 1px 0 var(--hl2)}
nav{box-shadow:0 -1px 0 var(--hl2)}header{border-bottom:1px solid var(--sd2)}
.card,.msg,.cal{background:linear-gradient(160deg,var(--card),var(--card3));border:1px solid var(--hl2);box-shadow:inset 1px 1px 0 var(--hl2),inset -1px -1px 0 var(--sd2),0 6px 0 var(--sd2)}
.cal{background:var(--card2)}
.b{background:linear-gradient(180deg,var(--b1),var(--b2));color:var(--bt);text-shadow:var(--bts);box-shadow:inset 1px 1px 0 var(--hl1),inset -1px -1px 0 var(--sd2),0 5px 0 var(--bd),0 9px 12px var(--sd2)}
.b:active{box-shadow:inset 1px 1px 0 var(--hl2),0 1px 0 var(--bd)}
.b.g{background:linear-gradient(180deg,var(--g1c),var(--g2c));color:var(--tx);text-shadow:0 1px 0 var(--sd2);box-shadow:inset 1px 1px 0 var(--hl2),inset -1px -1px 0 var(--sd2),0 5px 0 var(--gd),0 9px 12px var(--sd2)}

/* --- амбиент: canvas-сцены и мягкое свечение фона --- */
#amb{position:fixed;inset:0;z-index:0;pointer-events:none}
@supports (backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px)){
 header,nav,.comp{background:color-mix(in srgb,var(--bg2) 78%,transparent)!important;backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25)}
 .modal{backdrop-filter:blur(7px) saturate(1.15);-webkit-backdrop-filter:blur(7px) saturate(1.15)}
 .modal>div{box-shadow:0 -20px 60px var(--sd1),0 6px 0 var(--sd2)}
}
header{transition:transform .45s var(--ez),box-shadow .3s var(--ez),background .3s var(--ez)}
header.hhid{transform:translateY(calc(-100% - 10px))}
header.hscr{box-shadow:0 8px 24px var(--sd2)}
/* мягкое живое свечение фона (transform-only, GPU) */
.glow,.glow2{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0;opacity:var(--ambz)}
body::before,body::after{content:"";position:fixed;width:56vmax;height:56vmax;border-radius:50%;pointer-events:none;z-index:0;will-change:transform}
body::before{left:-18vmax;top:-16vmax;background:radial-gradient(circle at 50% 50%,var(--b1),transparent 62%);opacity:.16;animation:gdrift1 46s ease-in-out infinite alternate}
body::after{right:-20vmax;bottom:-18vmax;background:radial-gradient(circle at 50% 50%,var(--t2),transparent 62%);opacity:.13;animation:gdrift2 58s ease-in-out infinite alternate}
:root[data-md="light"] body::before{opacity:.22}
:root[data-md="light"] body::after{opacity:.18}
@keyframes gdrift1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(9vmax,7vmax,0) scale(1.18)}}
@keyframes gdrift2{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-8vmax,-6vmax,0) scale(.94)}}
/* блик на главных кнопках */
.b{position:relative;overflow:hidden}
.b::after{content:"";position:absolute;inset:-2px;border-radius:inherit;background:linear-gradient(115deg,transparent 32%,rgba(255,255,255,.5) 50%,transparent 62%);transform:translateX(-130%);pointer-events:none;opacity:0}
@media(hover:hover){.b:hover::after{opacity:1;transform:translateX(130%);transition:transform .8s var(--ez),opacity .2s}}
.b:active::after{opacity:.8}
/* более живой каскад появления страниц */
@keyframes fin2{from{opacity:0;transform:translateY(16px) scale(.985)}60%{opacity:1}to{opacity:1;transform:none}}
#app.pg>*{animation:fin2 .6s var(--ez) both}
#app.pg>*:nth-child(1){animation-delay:.02s}#app.pg>*:nth-child(2){animation-delay:.07s}#app.pg>*:nth-child(3){animation-delay:.12s}#app.pg>*:nth-child(4){animation-delay:.17s}#app.pg>*:nth-child(5){animation-delay:.22s}#app.pg>*:nth-child(6){animation-delay:.27s}#app.pg>*:nth-child(n+7){animation-delay:.32s}
/* тост с прогрессом */
.toast{overflow:hidden}
.toast::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.22);transform-origin:left;animation:tpg 5s linear forwards;border-radius:0 0 16px 16px}
@keyframes tpg{to{transform:scaleX(0)}}
/* плавная смена темы/режима */
.thx body,.thx header,.thx nav,.thx .comp,.thx .card,.thx .msg,.thx .cal,.thx input,.thx textarea,.thx select,.thx .b,.thx .seg,.thx .modal>div,.thx .vote,.thx .d,.thx .tc,.thx .tag,.thx .cap{transition:background-color .45s var(--ez),color .45s var(--ez),border-color .45s var(--ez),box-shadow .45s var(--ez)!important}
/* пустые состояния: лёгкийлевитация */
.empty .sic{animation:bob 3.6s ease-in-out infinite,sway 7s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(-4deg)}}
/* карточки: глубина при нажатии */
.card.li:active{transform:translateY(2px) scale(.995)}
.msg{animation:msgin .45s var(--spr) both}
/* кнопка режима в шапке */
#mdt{display:grid;place-items:center}
#mdt svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mdt .ma,#mdt .mi{display:grid;place-items:center}#mdt .mi{display:none}


#mdt:active svg{transform:rotate(40deg) scale(.9)}
#mdt svg{transition:transform .5s var(--spr)}
@media(prefers-reduced-motion:reduce){
 body::before,body::after{animation:none}
 #amb{display:none}
 .empty .sic{animation:none}
 html{scroll-behavior:auto}
}

:root[data-th="nova"][data-md="black"]{--bg:#000000;--bg2:#0a0a13;--card:#0d0d17;--card2:#11111d;--card3:#0a0a13;--inp:#0b0b15;--line:#232342;--tx:#e9eaf5;--mut:#8287b3;--h:#f0f0fa;--chord:#c3b7ff;--lbl:#a5b0ff;--sch:#c3b7ff;--b1:#8b7cf8;--b2:#6f5fee;--bd:#4a3cc0;--bt:#ffffff;--bts:0 -1px 0 rgba(0,0,20,.4);--g1c:#0e0e1a;--g2c:#08080f;--gd:#22223e;--t1:#cdc2ff;--t2:#a99cf5;--td:#7a6cc8;--tt:#0b0b18;--me1:#16152b;--me2:#111020;--metx:#eceafb;--mem:#8f8bbb;--stg:#05050e;--stgtx:#eef0ff;--sp1:#0f0f1e;--sp2:#050509;--spf:#f2f2ff;--g1:rgba(139,124,248,.14);--g2:rgba(255,150,120,.09);--hl1:rgba(220,215,255,.92);--hl2:rgba(220,215,255,.5);--sd1:rgba(0,0,0,.72);--sd2:rgba(0,0,0,.5);--cream:#f4f5ff;--ink:#12121f;--ac:#6f5fee;--lime:#e3bf7e;--me:#6f5fee;--bsh:#191345;--gsh:#1c1c31;--lsh:#4a3f9e;--csh:rgba(0,0,0,.65);--ambz:.4;color-scheme:dark}

/* --- nova: стеклянные карточки и глубина --- */
:root[data-th="nova"] .card{box-shadow:0 6px 0 var(--csh),0 18px 44px var(--sd1)}
@supports (backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px)){
 :root[data-th="nova"] .card{background:color-mix(in srgb,var(--card) 74%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-color:color-mix(in srgb,var(--line) 72%,transparent)}
 :root[data-th="nova"] input,:root[data-th="nova"] textarea,:root[data-th="nova"] select{background:color-mix(in srgb,var(--inp) 86%,transparent)}
}
/* --- nova: кнопки с градиентом и мягким свечением --- */
:root[data-th="nova"] .b{background:linear-gradient(135deg,var(--b1),var(--b2) 92%);color:#fff;box-shadow:0 5px 0 var(--bsh),0 12px 26px var(--sd2)}
:root[data-th="nova"] .b:active{box-shadow:0 1px 0 var(--bsh),0 4px 10px var(--sd2)}
:root[data-th="nova"] .b.g{background:var(--cream);color:var(--ink);box-shadow:0 5px 0 var(--gsh),0 12px 26px var(--sd2)}
:root[data-th="nova"] .b.g:active{box-shadow:0 1px 0 var(--gsh)}
:root[data-th="nova"] .b.s{box-shadow:0 4px 0 var(--bsh),0 8px 18px var(--sd2)}
:root[data-th="nova"] .b.g.s{box-shadow:0 4px 0 var(--gsh),0 8px 18px var(--sd2)}
:root[data-th="nova"] .seg button.on{background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;box-shadow:0 4px 0 var(--bsh)}
:root[data-th="nova"] .tag,:root[data-th="nova"] .cap,:root[data-th="nova"] .vote.on,:root[data-th="nova"] .step .n{box-shadow:0 4px 0 var(--lsh),0 8px 20px var(--sd2)}
:root[data-th="nova"] .tag,.cap{background:linear-gradient(135deg,#eecd8f,#cfa557)}
/* --- nova: навигация со свечением активной кнопки --- */
:root[data-th="nova"] nav button.on i{background:linear-gradient(135deg,#eecd8f,#cfa557);box-shadow:0 5px 0 var(--lsh),0 8px 26px var(--g1)}
/* --- nova: фокус и выделение --- */
:root[data-th="nova"] input:focus,:root[data-th="nova"] textarea:focus,:root[data-th="nova"] select:focus{border-color:var(--b1);box-shadow:0 0 0 3px var(--g1);outline:none}
::selection{background:var(--b2);color:#fff}
/* --- nova: скроллбар --- */
:root[data-th="nova"] ::-webkit-scrollbar{width:10px;height:10px}
:root[data-th="nova"] ::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:2px solid transparent;background-clip:content-box}
/* --- nova: сообщения --- */
:root[data-th="nova"] .msg.me{border-color:color-mix(in srgb,var(--b1) 45%,transparent)}
:root[data-th="nova"] .msg.me .mut{color:var(--mem)}
:root[data-th="nova"] .msg{box-shadow:0 4px 0 var(--csh),0 12px 26px var(--sd2)}
:root[data-th="nova"][data-md="light"] .msg.me .rxc,:root[data-th="nova"][data-md="light"] .msg.me .po,:root[data-th="nova"][data-md="light"] .msg.me .pbadge span{background:rgba(99,85,224,.10);border-color:rgba(99,85,224,.22);color:var(--metx)}
:root[data-th="nova"] .msg img{border-color:color-mix(in srgb,var(--line) 80%,transparent)}
:root[data-th="nova"] .modal{background:rgba(6,7,22,.66)}
:root[data-th="nova"][data-md="light"] .modal{background:rgba(50,52,100,.35)}
/* --- nova: ховер карточек на десктопе --- */
@media(hover:hover){:root[data-th="nova"] .card.li:hover{transform:translateY(-3px);box-shadow:0 9px 0 var(--csh),0 22px 48px var(--sd1)}}
/* --- nova: световой фон в дневном режиме мягче --- */
:root[data-th="nova"][data-md="light"] .bk{opacity:.045}

/* --- карточки выбора режима (Ночь/День) в Оформлении --- */
.mdg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 8px}
.mdg .mdc:nth-child(3){grid-column:1/-1}
.mdc{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:13px 10px 12px;border:2px solid var(--line);border-radius:20px;background:var(--card2);color:var(--tx);cursor:pointer;font:800 15px var(--fb);box-shadow:0 5px 0 var(--csh);transition:transform .25s var(--spr),border-color .2s,background .2s}
.mdc:active{transform:translateY(3px)}
.mdc .mdp{position:relative;width:100%;height:88px;border-radius:14px;display:grid;place-items:center;font-size:36px;overflow:hidden;font-style:normal}
.mdc .mdp::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.4) 48%,transparent 62%);transform:translateX(-130%)}
.mdc:active .mdp::after{transform:translateX(130%);transition:transform .7s var(--ez)}
.mdc b{font-size:16px;letter-spacing:.01em}
.mdc .mut{font-weight:700;font-size:11.5px;text-align:center;line-height:1.35}
.mdc .ck{position:absolute;top:9px;right:9px;width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,var(--b1),var(--b2));color:#fff;display:grid;place-items:center;font-size:13px;box-shadow:0 2px 0 var(--bsh);opacity:0;transform:scale(.3);transition:.3s var(--spr)}
.mdc.on{border-color:var(--b1);background:var(--card);box-shadow:0 5px 0 var(--b1),0 12px 30px var(--g1)}
.mdc.on .ck{opacity:1;transform:scale(1)}

/* --- nova: сплэш — стикеры-чипы, аврора, прогресс --- */
:root[data-th="nova"] #splash::before,:root[data-th="nova"] #splash::after{content:"";position:absolute;border-radius:50%;pointer-events:none;z-index:0}
:root[data-th="nova"] #splash::before{width:70vmax;height:70vmax;left:-22vmax;top:-26vmax;background:radial-gradient(circle,rgba(139,124,248,.42),transparent 62%);animation:gdrift1 26s ease-in-out infinite alternate}
:root[data-th="nova"] #splash::after{width:58vmax;height:58vmax;right:-18vmax;bottom:-22vmax;background:radial-gradient(circle,rgba(255,160,110,.24),transparent 62%);animation:gdrift2 32s ease-in-out infinite alternate}
:root[data-th="nova"][data-md="light"] #splash::before{opacity:.55}
:root[data-th="nova"][data-md="light"] #splash::after{opacity:.6}
:root[data-th="nova"] #splash .o{-webkit-text-stroke:3px rgba(190,180,255,.55)}
:root[data-th="nova"] #splash .f{text-shadow:2px 2px 0 #cfc4ff,4px 4px 0 #b3a4fa,6px 6px 0 #8d7cf0,8px 8px 0 #6a58d8,10px 10px 0 #4a3cae,12px 14px 18px rgba(0,0,10,.5)}
:root[data-th="nova"][data-md="light"] #splash .f{text-shadow:2px 2px 0 #ddd5ff,4px 4px 0 #c4b7fb,6px 6px 0 #a794f4,8px 8px 0 #8371e0,10px 10px 0 #5f4ebc,12px 14px 16px rgba(70,70,140,.3)}
:root[data-th="nova"][data-md="light"] #splash .o{-webkit-text-stroke:3.5px rgba(124,110,225,.55)}
:root[data-th="nova"][data-md="light"] #splash .mcs{color:#5f4ecb;text-shadow:1.5px 1.5px 0 rgba(255,255,255,.85),0 0 12px rgba(124,108,246,.28)}
#splash .pbar{position:absolute;left:0;bottom:0;height:3px;width:100%;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,var(--b1),var(--lime));z-index:4;animation-name:pbarx;animation-timing-function:linear;animation-fill-mode:forwards;animation-duration:6s}
@keyframes pbarx{to{transform:scaleX(1)}}
#splash .skip{z-index:4}
@media(prefers-reduced-motion:reduce){
 :root[data-th="nova"] #splash::before,:root[data-th="nova"] #splash::after{animation:none}
 #splash .pbar{animation:none;transform:scaleX(0)}
}
/* --- авто-облегчённый режим для слабых устройств (включается сам при низком FPS) --- */
.plite #amb{display:none}
.plite header,.plite nav,.plite .comp,.plite .modal,.plite .card{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
.plite header,.plite nav,.plite .comp{background:var(--bg2)!important}
.plite .card{background:color-mix(in srgb,var(--card) 94%,transparent)!important;border-color:var(--line)!important}
/* ================= МЕД — ИИ-помощник ================= */
#medov{position:fixed;inset:0;z-index:40;background:rgba(8,9,22,.62);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);opacity:0;pointer-events:none;transition:opacity .22s ease}

.medsheet{width:min(560px,100%);max-height:min(720px,92%);display:flex;flex-direction:column;background:var(--card);border:1px solid color-mix(in srgb,var(--line) 80%,transparent);border-bottom:0;border-radius:26px 26px 0 0;overflow:hidden;box-shadow:0 -18px 60px rgba(0,0,0,.35);transform:translateY(56px);transition:transform .36s cubic-bezier(.22,1.3,.32,1)}
#medov.on .medsheet{transform:none}
@media(min-width:700px){.medsheet{border-radius:26px;border-bottom:1px solid color-mix(in srgb,var(--line) 80%,transparent);margin-bottom:4vh;max-height:84vh}}
@media(prefers-reduced-motion:reduce){.medsheet{transform:none;transition:none}}
.medhead{display:flex;gap:13px;align-items:center;padding:13px 16px 11px;background:linear-gradient(135deg,#ffe7b0,#f6c56a 55%,#e9a83e);color:#4a2c0f;flex:none}

.medhead .mclose:active{transform:scale(.88)}
.medhead .mback{border:0;background:rgba(74,44,15,.15);color:#4a2c0f;width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:transform .15s,opacity .2s}

:is(#medface,.med-avatar){width:98px;height:98px;flex:none;filter:drop-shadow(0 4px 9px rgba(20,60,35,.22))}
#medov .medhead :is(#medface,.med-avatar){animation:menter .8s cubic-bezier(.34,1.56,.64,1) both}
@keyframes menter{0%{transform:translateY(34px) scale(.22);opacity:0}55%{transform:translateY(-8px) scale(1.14);opacity:1}75%{transform:translateY(2px) scale(.95)}100%{transform:none}}
:is(#medface,.med-avatar) .m-open{transform-origin:60px 40px}

:is(#medface,.med-avatar) .m-closed,:is(#medface,.med-avatar) .m-happy,:is(#medface,.med-avatar) .m-tongue,:is(#medface,.med-avatar) .m-brow,:is(#medface,.med-avatar) .m-zzz{opacity:0}
:is(#medface,.med-avatar) .m-pup{transform:translate(var(--px,0px),var(--py,0px));transition:transform .18s ease-out}
:is(#medface,.med-avatar) .m-all{transform-origin:60px 107px}
:is(#medface,.med-avatar) .m-head{transform-origin:60px 60px}
:is(#medface,.med-avatar) .m-ear{transition:transform .25s ease}
:is(#medface,.med-avatar) .m-tail{transform-origin:84px 97px;animation:mtail 1.7s ease-in-out infinite}
@keyframes mtail{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
@keyframes mtailfast{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(20deg)}}
@keyframes mtailsad{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
:is(#medface,.med-avatar)[data-mood="sleep"] .m-open{opacity:0}
:is(#medface,.med-avatar)[data-mood="sleep"] .m-blink{animation:none}
:is(#medface,.med-avatar)[data-mood="sleep"] .m-closed{opacity:1}
:is(#medface,.med-avatar)[data-mood="sleep"] .m-zzz{opacity:1;animation:mzzz 2.6s ease-in-out infinite}
:is(#medface,.med-avatar)[data-mood="sleep"] .m-all{animation:mbreath 3.4s ease-in-out infinite}
:is(#medface,.med-avatar)[data-mood="sleep"] .m-tail{animation:mtailsad 3.4s ease-in-out infinite}
:is(#medface,.med-avatar)[data-mood="wake"] .m-ear-l{animation:mflap .6s ease}
:is(#medface,.med-avatar)[data-mood="wake"] .m-ear-r{animation:mflap .6s ease .08s}
:is(#medface,.med-avatar)[data-mood="wake"] .m-all{animation:mwig .55s ease}
@keyframes mflap{35%{transform:rotate(-13deg)}70%{transform:rotate(7deg)}}
@keyframes mwig{30%{transform:rotate(-2.6deg)}65%{transform:rotate(1.8deg)}}
:is(#medface,.med-avatar)[data-mood="happy"] .m-open{opacity:0}
:is(#medface,.med-avatar)[data-mood="happy"] .m-blink{animation:none}
:is(#medface,.med-avatar)[data-mood="happy"] .m-happy{opacity:1}
:is(#medface,.med-avatar)[data-mood="happy"] .m-tongue{opacity:1}
:is(#medface,.med-avatar)[data-mood="happy"] .m-tail{animation:mtailfast .42s ease-in-out infinite}
:is(#medface,.med-avatar)[data-mood="happy"] .m-all{animation:mjump .8s cubic-bezier(.3,1.4,.4,1) infinite}
@keyframes mjump{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-7px) scale(1.02)}55%{transform:translateY(0) scale(.985)}72%{transform:translateY(-2.5px) scale(1.005)}}
:is(#medface,.med-avatar)[data-mood="think"] .m-head{animation:mtilt 1.15s ease-in-out infinite}
:is(#medface,.med-avatar)[data-mood="think"] .m-pup{transform:translate(calc(var(--px,0px) - 2.8px),calc(var(--py,0px) - 3.2px))}
:is(#medface,.med-avatar)[data-mood="think"] .m-tail{animation:mtail 2.4s ease-in-out infinite}
@keyframes mtilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
:is(#medface,.med-avatar)[data-mood="listen"] .m-open{animation:none;transform:scale(1.16)}
:is(#medface,.med-avatar)[data-mood="listen"] .m-ear-l{transform:rotate(-11deg) translateY(-2px)}
:is(#medface,.med-avatar)[data-mood="listen"] .m-ear-r{transform:rotate(11deg) translateY(-2px)}
:is(#medface,.med-avatar)[data-mood="listen"] .m-all{animation:mlean 1.5s ease-in-out infinite}
@keyframes mlean{0%,100%{transform:rotate(0)}50%{transform:rotate(2.4deg) translateY(-1.5px)}}
:is(#medface,.med-avatar)[data-mood="sad"] .m-open{transform:scaleY(.5)}
:is(#medface,.med-avatar)[data-mood="sad"] .m-blink{animation:none}
:is(#medface,.med-avatar)[data-mood="sad"] .m-brow{opacity:1}
:is(#medface,.med-avatar)[data-mood="sad"] .m-ear-l{transform:rotate(13deg) translateY(3px)}
:is(#medface,.med-avatar)[data-mood="sad"] .m-ear-r{transform:rotate(-13deg) translateY(3px)}
:is(#medface,.med-avatar)[data-mood="sad"] .m-tail{animation:mtailsad 2.8s ease-in-out infinite}
:is(#medface,.med-avatar)[data-mood="sad"] .m-all{animation:msigh 2.8s ease-in-out infinite}
@keyframes msigh{50%{transform:translateY(1.5px) scale(.985)}}
:is(#medface,.med-avatar)[data-mood="wow"] .m-open{transform:scale(1.32)}
:is(#medface,.med-avatar)[data-mood="wow"] .m-tail{animation:mtailfast .5s ease-in-out infinite}
@keyframes mbreath{50%{transform:scale(1.035)}}
@keyframes mzzz{0%{opacity:0;transform:translate(0,3px)}28%{opacity:1}100%{opacity:0;transform:translate(8px,-10px)}}

.mv .mvt span{font:600 12px var(--fb);color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.mlyr{max-height:30vh;overflow:auto;overscroll-behavior:contain;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,var(--card3) 78%,transparent);border:1.5px solid color-mix(in srgb,var(--line) 70%,transparent);white-space:pre-wrap;font:500 13.5px/1.62 ui-monospace,Menlo,Consolas,monospace;color:var(--tx)}
.mlyr textarea{width:100%;min-height:170px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;background:var(--inp);color:var(--tx);padding:10px;font:500 13px/1.55 ui-monospace,Menlo,monospace}
.macts{display:flex;gap:8px;flex-wrap:wrap;margin-top:1px}
.mact{border:1.5px solid color-mix(in srgb,var(--line) 80%,transparent);background:color-mix(in srgb,var(--card2) 88%,transparent);color:var(--tx);border-radius:12px;padding:8px 12px;font:800 13px var(--fb);cursor:pointer;transition:transform .13s,opacity .2s;animation:mbin .3s both}
.mact:active{transform:scale(.94)}
.mact.go{background:linear-gradient(135deg,#ffd98a,#f0b04f);border-color:transparent;color:#4a2c0f;box-shadow:0 3px 0 rgba(122,74,15,.35)}
.macts.dead{pointer-events:none;opacity:.4}
@media(hover:hover){.mact:hover{transform:translateY(-1.5px)}}
.mkeys{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.mk{padding:9px 0;border-radius:11px;border:1.5px solid color-mix(in srgb,var(--line) 80%,transparent);background:color-mix(in srgb,var(--card2) 88%,transparent);color:var(--tx);font:800 13.5px var(--fb);cursor:pointer;transition:transform .12s,background .12s}
.mk:active{transform:scale(.92)}
.mk.on{background:linear-gradient(135deg,#ffe3a3,#f0b04f);color:#4a2c0f;border-color:transparent;animation:selpop .3s ease}
.mk.skip{grid-column:1/-1;color:var(--mut);font-weight:700}
.medbar{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1.5px solid color-mix(in srgb,var(--line) 55%,transparent);background:color-mix(in srgb,var(--bg2) 74%,transparent);flex:none}
.medbar textarea{flex:1;resize:none;max-height:96px;border-radius:16px;border:1.5px solid color-mix(in srgb,var(--line) 80%,transparent);background:var(--inp);color:var(--tx);padding:11px 13px;font:600 14.5px/1.4 var(--fb)}
.medmic{position:relative;flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--line) 80%,transparent);background:color-mix(in srgb,var(--card2) 92%,transparent);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .25s,color .25s}
.medmic:active{transform:scale(.9)}
.medmic svg{width:20px;height:20px}
.medsend{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:linear-gradient(135deg,#ffd98a,#f0b04f);color:#4a2c0f;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(122,74,15,.35);transition:transform .14s}
.medsend:active{transform:scale(.88)}
.medsend svg{width:19px;height:19px}
.medmic.glow{background:linear-gradient(135deg,#ff6b5e,#e63946);color:#fff;border-color:transparent;animation:mpulse 1.5s ease-in-out infinite}
.medmic.glow::before,.medmic.glow::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2.5px solid rgba(230,57,70,.55);box-shadow:0 0 18px rgba(230,57,70,.45),inset 0 0 10px rgba(230,57,70,.2);animation:mring 1.5s ease-out infinite;pointer-events:none}
.medmic.glow::after{animation-delay:.5s}
@keyframes mring{from{transform:scale(1);opacity:.9}to{transform:scale(1.8);opacity:0}}
@keyframes mpulse{50%{box-shadow:0 0 0 8px rgba(230,57,70,.16)}}
.plite #medov{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(8,9,22,.8)}
@media(prefers-reduced-motion:reduce){.mb,.mv,.mact{animation:none!important}.medmic.glow::before,.medmic.glow::after{animation:none}:is(#medface,.med-avatar) .m-blink,:is(#medface,.med-avatar) .m-tail,:is(#medface,.med-avatar) .m-all,:is(#medface,.med-avatar) .m-head,#medov .medhead :is(#medface,.med-avatar){animation:none!important}}
/* ============ микроплавность всего сайта ============ */
.b{transition:transform .13s cubic-bezier(.34,1.56,.64,1),box-shadow .13s ease}
.b:active{transform:translateY(1.5px) scale(.965)}
@media(hover:hover){.b:not(:disabled):hover{transform:translateY(-1.5px)}}
.card.li{transition:transform .16s ease,box-shadow .16s ease}
.card.li:active{transform:scale(.985)}
input,textarea,select{transition:border-color .16s ease,box-shadow .16s ease}
nav button i{transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
nav button:active i{transform:scale(.86) translateY(1px)}
.modal>div{animation:sheet .34s cubic-bezier(.24,1.25,.32,1)}
.stk img,.rxp button{transition:transform .14s cubic-bezier(.34,1.56,.64,1)}
.stk img:active,.rxp button:active{transform:scale(.88)}
@media(prefers-reduced-motion:reduce){.b,.card.li,nav button i,.stk img,.rxp button{transition:none}}

 if(sq){const s=Math.min(w,h);c.width=c.height=Math.min(max,s);x.drawImage(im,(w-s)/2,(h-s)/2,s,s,0,0,c.width,c.height)}
 else{const k=Math.min(1,max/Math.max(w,h));c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));x.drawImage(im,0,0,c.width,c.height)}
 if(im.close)im.close();const b=await new Promise((res,rej)=>c.toBlob(r=>r?res(r):rej(new Error("blob")),"image/jpeg",.78));b.dims=[c.width,c.height];return b}

/* ---- HOLYCHORDS: база христианских песен — главный источник (там есть аккорды и тональность) ----
   holychords.pro не отдаёт CORS и отдаёт JSON только с заголовком X-Requested-With,
   поэтому идём через свой same-origin прокси /hc/* (файл _redirects на Netlify:
   /hc/* https://holychords.pro/:splat 200 — прокси пересылает запрос вместе с заголовками). */
function hcKey(t){const info=WMusic.keyInfo(t);return info?NOTES[info.pitch]+(info.minor?"m":""):""}
function hcText(t){
 const CR2=/^[A-H][#b]?(m|maj|min|dim|aug|sus|add|M)?[0-9]*(?:[-+][0-9]+)?(\([^)]*\))?(\/[A-H][#b]?)?$/
  ,fx=w=>{const m=w.match(/^\(([A-H][#b]?[^)]*)\)$/);if(m)w=m[1];w=w.replace(/^([A-H])/,c=>c==="H"?"B":c);w=w.replace(/\/([A-H])(?=$|[#b])/,c=>c==="H"?"/B":c);return w.replace(/-(\d+)/g,"(b$1)").replace(/\+(\d+)/g,"(#$1)")};
 return String(t||"").replace(/\r/g,"").split("\n").map(l=>{
  const tk=l.trim().split(/\s+/).filter(Boolean);
  if(!tk.length||!tk.every(w=>CR2.test(w)||/^\([A-H][#b]?[^)]*\)$/.test(w)))return l;
  return tk.map(fx).filter(Boolean).join("  ");
 }).join("\n")}
function hcNorm(x){const yt=String(x.youtube||"").trim();
 return{id:"hc"+x.id,trackName:String(x.name||"").trim(),artistName:(x.artist&&(x.artist.name||x.artist.isp_name))||"Holychords",plainLyrics:hcText(x.text),duration:0,tonal:hcKey(x.tonal),bpm:String(x.bpm||""),hcLink:yt?"https://youtu.be/"+yt:""}}
async function hcRequest(path,signal){
 const hosted=typeof SONG_SEARCH_FUNCTION!=="undefined"&&SONG_SEARCH_FUNCTION,endpoint=path.split("?",1)[0],query=path.slice(path.indexOf("?")+1);
 const urls=hosted?["/functions/v1/"+SONG_SEARCH_FUNCTION+"?source="+encodeURIComponent(endpoint)+"&"+query]:["/hc/"+path,"https://holychords.pro/"+path];let available=false;
 for(const url of urls){if(signal?.aborted)throw new DOMException("Aborted","AbortError");const control=new AbortController(),abort=()=>control.abort();signal?.addEventListener("abort",abort,{once:true});const timer=setTimeout(()=>control.abort(),8000);
  try{const response=await (hosted?sbFetch:fetch)(url,{headers:hosted?{Accept:"application/json"}:{"X-Requested-With":"XMLHttpRequest",Accept:"application/json"},signal:control.signal});if(!response.ok)continue;const json=await response.json();if(Array.isArray(json?.musics?.data)){available=true;return{available:true,songs:json.musics.data.map(hcNorm).filter(s=>s.trackName&&s.plainLyrics)}}}
  catch(e){if(signal?.aborted)throw e}finally{clearTimeout(timer);signal?.removeEventListener("abort",abort)}
 }
 return{available,songs:[]};
}
async function hcSearch(q,signal){
 const callerSignal=signal,deadline=new AbortController(),cancel=()=>deadline.abort();callerSignal?.addEventListener("abort",cancel,{once:true});const timeout=setTimeout(cancel,20000);signal=deadline.signal;
 try{
 const corpus=searchCorpus(),queries=WSearch.variants(q,corpus),all=new Map();let available=false,requests=0;
 const collect=r=>{available=available||r.available;r.songs.forEach(s=>all.set(s.id,s))};
 // /search is the source site's full search, including lyrics; fast search alone is too broad.
 const first=queries[0]||q;
 const initial=await Promise.allSettled([hcRequest("search?name="+encodeURIComponent(first),signal),hcRequest("search-fast?name="+encodeURIComponent(first),signal)]);requests=2;
 for(const result of initial)if(result.status==="fulfilled")collect(result.value);
 if(callerSignal?.aborted)throw new DOMException("Aborted","AbortError");
 let ranked=WSearch.rank(queries,[...all.values()],12);
 const fallback=[...queries.slice(1),...WSearch.anchors(first)];
 for(const query of fallback){if(signal.aborted||requests>=6||(ranked[0]?.score||0)>=180)break;try{collect(await hcRequest("search?name="+encodeURIComponent(query),signal))}catch(e){if(callerSignal?.aborted)throw e;break}requests++;ranked=WSearch.rank(queries,[...all.values()],12)}
 return available?ranked.map(({song,kind,snippet})=>({...song,matchKind:kind,matchSnippet:snippet})):null;
 }finally{clearTimeout(timeout);callerSignal?.removeEventListener("abort",cancel)}
}

 if(mW(s,"как дела","как ты","как жизнь","как настроение","как поживаешь","чем занят","что делаешь"))return()=>{mood("happy");medSay("Отлично! Поглядываю на клавиатуру, поглядываю на дверь, виляю хвостом 🐾 Мечтаю, чтобы ты попросил найти слова какой-нибудь песни. А у тебя как дела?",420)};

 if(mW(s,"анекдот","шутка","шутку","рассмеши","пошути","смешное"))return()=>{mood("wow");medSay(pick1(["Заходит кот в бар… а я за ним — я же пёс! 🐶 Собачья шутка, знаю-знаю 😄","Что говорит пёс-программист? Гав… гав… а на бэкенде — Вуф! 🐾","Почему пёс отлично ищет песни? У меня чуткий «нюх» на хиты 🎶"])+" Ещё — просто попроси!",420)};
 if(mW(s,"молодец","умница","красавчик","хороший пес","хороший пёс","люблю тебя","погладить"))return()=>{mood("happy");medSay("Тяф! Слышу похвалу — сразу подрос на пару сантиметров 🐕 Спасибо!",380)};
 if(mW(s,"пока","до свидания","прощай","бывай","спокойной ночи"))return()=>{mood("sleep");medSay("Пока-пока! Приду дремать тут и ждать нового поиска 🐾💤",380).then(()=>actions([["Начать заново",reset]]))};
 const wm=s.match(/(?:^|\s)(?:кто|что) (?:такой|такая|такое|такие)\s+(.{2,60})/);
 if(wm)return()=>wikiSay(wm[1].replace(/[?!.]+$/,""));

function onMic(){
 wake();
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){toast("Голосовой ввод не поддерживается в этом браузере");return}
 if(recOn||recs.length){stopRec();return}
 try{
  const r=new SR();recs.push(r);rec=r;recOn=true;
  r.lang="ru-RU";r.interimResults=true;r.maxAlternatives=1;
  r.onstart=()=>{if(r.w_stopped)return;recOn=true;micB.classList.add("glow");mood("listen");inp.placeholder="Слушаю тебя… гав!"};
  r.onresult=e=>{if(r.w_stopped)return;let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;inp.value=s;grow()};
  r.onerror=e=>{if(r.w_stopped)return;if(e.error==="not-allowed"||e.error==="service-not-allowed")toast("Разреши доступ к микрофону в настройках браузера");else if(e.error!=="no-speech"&&e.error!=="aborted")toast("Не вышло послушать — попробуй ещё раз")};
  r.onend=()=>{recs=recs.filter(x=>x!==r);if(r.w_stopped)return;if(!recs.length){recOn=false;micB.classList.remove("glow");if(face&&face.dataset.mood==="listen")mood("wake");inp.placeholder=MPLACE}};
  r.start();
 }catch(e){toast("Голосовой ввод недоступен");stopRec()}
}
